# base
set -g prefix C-a
bind C-a send-prefix
unbind C-b
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 10000
set -g escape-time 10

# pane nav (vim-style, prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# scrolling (wheel + PgUp enter copy mode; q exits; scroll to bottom exits)
set -g mouse on
set -g mode-keys vi
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "select-pane -t =; copy-mode -e"
bind -n WheelDownPane select-pane -t =; send-keys -M
bind -n PPage copy-mode -e
# copy: mouse drag -> macOS clipboard (pbcopy)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# plugins (tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-yank'

# status
set -g status-style 'bg=#1e1e2e'
run '~/.tmux/plugins/tpm/tpm'
