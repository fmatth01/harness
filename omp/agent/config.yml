setupVersion: 2
modelRoles:
  advisor: anthropic/claude-sonnet-5:low
  default: zai/glm-5.3-flash:max
  smol: zai/glm-5.3-flash:max
  slow: anthropic/claude-opus-5:max
  plan: openai-codex/gpt-5.6-sol:high
  designer: anthropic/claude-sonnet-5:medium
  commit: zai/glm-5.3-flash:max
  task: zai/glm-5.3-flash:max
  tiny: zai/glm-5.3-flash:max
  vision: anthropic/claude-sonnet-5:high
defaultThinkingLevel: auto
terminal:
  showProgress: true
display:
  cacheMissMarker: true
tier:
  anthropic: none
disabledProviders:
  []
advisor:
  enabled: true
  syncBacklog: "1"
  immuneTurns: 1
astGrep:
  enabled: true
statusLine:
  preset: custom
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  leftSegments:
    - model
    - mode
    - path
    - git
    - subagents
  rightSegments:
    - context_pct
    - cost
    - cache_hit
    - token_total
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 24
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
  compactThinkingLevel: false
  showHookStatus: true
task:
  eager: always
  maxConcurrency: 16
  enableLsp: true
  agentAdvisor:
    task: "off"
autolearn:
  enabled: true
  autoContinue: false
  minToolCalls: 20
secrets:
  enabled: true
steeringMode: all
autoResume: true
checkpoint:
  enabled: true
github:
  enabled: true
tui:
  tight: false
  scrollbackRebuild: true
browser:
  headless: false
followUpMode: all
stt:
  modelName: parakeet
  enabled: true
cycleOrder:
  - default
  - tiny
  - slow
hideThinkingBlock: false
lsp:
  enabled: true
  lazy: false