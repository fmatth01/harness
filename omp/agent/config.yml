setupVersion: 1
modelRoles: 
  advisor: anthropic/claude-sonnet-5:low
  default: deepseek/deepseek-v4-flash:max
  smol: deepseek/deepseek-v4-flash:max
  slow: anthropic/claude-opus-5:max
  plan: deepseek/deepseek-v4-flash:max
  vision: anthropic/claude-sonnet-5:med
  designer: deepseek/deepseek-v4-flash:max
  commit: deepseek/deepseek-v4-flash:max
  task: deepseek/deepseek-v4-flash:max
  tiny: deepseek/deepseek-v4-flash
  smart: anthropic/claude-fable-5:xhigh
defaultThinkingLevel: auto
terminal: 
  showProgress: true
display: 
  cacheMissMarker: true
tier: 
  anthropic: none
disabledProviders: 
  []
advisor: 
  enabled: true
  syncBacklog: "1"
  immuneTurns: 1
astGrep: 
  enabled: true
statusLine: 
  preset: custom
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  leftSegments: 
    - model
    - mode
    - path
    - git
    - subagents
  rightSegments: 
    - context_pct
    - cost
    - cache_hit
    - token_total
    - session_name
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 24
      stripWorkPrefix: true
    git: 
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
  compactThinkingLevel: false
  showHookStatus: true
task: 
  eager: always
  maxConcurrency: 16
  enableLsp: true
autolearn: 
  enabled: true
  autoContinue: false
  minToolCalls: 20
secrets: 
  enabled: true
steeringMode: all
autoResume: true
checkpoint: 
  enabled: true
github: 
  enabled: true
tui: 
  tight: false
  scrollbackRebuild: true
browser: 
  headless: false
followUpMode: all
stt: 
  modelName: parakeet
  enabled: true
cycleOrder: 
  - default
  - tiny
  - smart
  - slow
hideThinkingBlock: false
lsp: 
  enabled: true